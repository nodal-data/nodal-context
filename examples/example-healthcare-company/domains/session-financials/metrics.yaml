# metrics.yaml — metric definitions. Human-owned `definition`. No statistics.
metrics:
  - name: collection_rate
    definition: >
      Share of allowed amount actually collected on adjudicated claims. Sessions
      under 45 days old haven't adjudicated and read artificially low; Payer Y is
      excluded (different reimbursement cycle).
    grain: note_id x authorized_service_id
    status: confirmed
    parameters:
      - name: as_of_date
        note: the adjudication cutoff is relative to this date
      - name: time_window
        note: which sessions to include
    caveats:
      - Blank payer_name is meaningful, not missing-at-random — say so when
        filtering by payer.
      - Payers are state-specific (Payer X-TX vs Payer X-FL are different
        contracts/rates); never aggregate across states.
    common_filters:
      - standard hygiene filters (see reference.md)
    expression:
      measure: SUM(collected_amount) / SUM(allowed_amount)
      mandatory_filters:
        - field: session_date
          op: "<"
          value: "<as_of_date> - 45 days"
          reason: claims take ~45 days to adjudicate; recent sessions read artificially low
        - field: payer_name
          op: not_ilike
          value: "Payer Y%"
          reason: different reimbursement cycle skews the rate
      allowed_dimensions: [payer_name, session_date]
    lineage:
      - source: dbt_core
        models: [fct_session_financials]

  # ACF 0.2 syntax examples only; these additions await analyst confirmation.
  - name: observed_notes
    definition: Distinct notes represented in session financials.
    grain: note_id
    status: draft
    expression:
      measure: COUNT(DISTINCT note_id)
      allowed_dimensions: [session_date]
    lineage:
      - source: dbt_core
        models: [fct_session_financials]

  - name: notes_missing_payer
    definition: Notes with at least one session row whose payer is null or blank.
    grain: note_id
    status: draft
    expression:
      measure: COUNT(DISTINCT note_id)
      mandatory_filters:
        - any_of:
            - {field: payer_name, op: is_null}
            - {field: payer_name, op: '=', value: ''}
          reason: Checking only SQL null misses blank payer names.
      allowed_dimensions: [session_date]
    lineage:
      - source: dbt_core
        models: [fct_session_financials]

  - name: notes_with_multiple_services
    definition: Notes with at least two distinct authorized services among surviving rows.
    grain: note_id
    status: draft
    expression:
      measure: COUNT(DISTINCT note_id)
      entity_filters:
        - entity: note_id
          having:
            - {measure: 'COUNT(DISTINCT authorized_service_id)', op: '>=', value: 2}
          reason: Multiple-service eligibility belongs to the note, not one session row.
      allowed_dimensions: [session_date]
    lineage:
      - source: dbt_core
        models: [fct_session_financials]

  - name: missing_payer_note_rate
    definition: Share of observed notes with at least one missing payer.
    grain: note_id
    status: draft
    expression:
      measure: metric(notes_missing_payer) / metric(observed_notes)
      allowed_dimensions: [session_date]
    # Lineage is inherited from both referenced metrics.
