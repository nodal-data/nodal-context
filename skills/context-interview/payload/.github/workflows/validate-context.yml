# Validate ACF on every PR: schemas pass, links resolve, drafts are surfaced.
name: validate-context
on:
  pull_request:
    paths: ['domains/**', 'entities/**', 'methods/**', 'company/**', 'evals/seeds/**', 'evals/verified/*.sql.age', 'evals/verified/*.sql.sops', 'context.config.yaml', 'schemas/**', 'acf_runtime/**', '.ci/**', '**/*.md']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema pyyaml
      - name: Validate YAML against ACF schemas
        run: python .ci/validate.py        # validates entities/metrics/domain/seeds
      - name: Surface effective draft status (report only)
        run: |
          python - <<'PY'
          from acf_runtime import load_context
          registry = load_context('.')
          for node in sorted(registry.nodes.values(), key=lambda n: n.id):
              if node.effective_status != 'confirmed':
                  print(node.id + ': ' + ', '.join(sorted(node.blocking_reasons)))
          PY
