# evals/seeds/<name>.seed.yaml — one harvested ground-truth pair.
# Start draft. A real analyst confirms the interpretation and the relevant evidence.
question: "<a question a user might actually ask>"
domain: <domain>
intent: >
  <the confirmed correct meaning — including the disambiguation the naive reading
  would miss>
# ir: structured decomposition (schemas/ir.schema.json). Required before confirming
#   a positive metric/method seed; optional for entity and negative seeds.
#   Use canonical names, never an alias. It complements intent/expected.
# ir:
#   metric: <name in domains/<domain>/metrics/<name>.yaml>
#   dimensions: [<column>]
#   filters:
#     - field: <column>
#       op: <e.g. ilike | in | "<">
#       value: <literal or <placeholder>>
#   time_window: <relative token, e.g. last_quarter — keep evergreen seeds relative>
expected:
  kind: sql_shape              # semantic_entity | sql_shape | value_at_snapshot | negative
  must_include: []             # for sql_shape
  must_exclude: []
  # entity: <name>             # for semantic_entity
  # value: <n>                 # for value_at_snapshot
  # as_of: "<YYYY-MM-DD>"      # pin the actual snapshot date; quotes keep YAML portable
  # key_columns: [<key>]       # required when value contains multiple row objects
  # tolerance: {absolute: 0}   # agree before execution; default is exact comparison
provenance: interview          # interview | dashboard | correction | generated | observed | notebook
# verified_query_file: evals/verified/<name>.sql   # set ONLY on a Stage-5 verified
#   match — points at a LOCAL, gitignored sidecar holding the blessed read-only SQL.
#   Capture/encrypt approved SQL together. Commit .sql.age or .sql.sops ciphertext,
#   never plaintext or private keys. Explicit local-only mode is not encryption.
#   Python-only notebook verification does not require a SQL sidecar.
lineage:
  - source: dbt_core
    models: []

# --- value_at_snapshot variant (replace placeholders with reviewed evidence) ---
# Written by Stage 5 when the context-on answer matches the analyst's dashboard:
#
# question: "What was our collection rate by payer, last quarter?"
# domain: session-financials
# intent: >
#   Collection rate on adjudicated claims, state-specific payer resolution,
#   sessions >= 45 days old. (The confirmed assumptions the verified query used.)
# ir:                          # the decomposition the verified query actually used
#   metric: collection_rate
#   dimensions: [payer_name]
#   time_window: { start: "2026-01-01", end: "2026-03-31" }   # absolute is OK here —
#                              # expected.as_of pins this seed to a snapshot anyway
# expected:
#   kind: value_at_snapshot
#   value: <actual-approved-value>  # not an estimate, saved notebook output, or simulator claim
#   as_of: "2026-03-31"        # pin it (quoted) — a live number with no snapshot tells you nothing
# provenance: dashboard
# verified_query_file: evals/verified/collection-rate.sql   # ignored plaintext; ciphertext can travel
# lineage:
#   - source: dbt_core
#     models: [fct_session_financials]

# --- method IR alternative (use method OR metric, never both) ---
# ir:
#   method: <slug from methods/<slug>.md>
#   metrics: [<domain>.<resolved-metric>]
#   parameters: {<parameter-name>: <reviewed-binding>}
# Grade method decisions, output.must_state and qualitative checks as well as any
# snapshot values. Numerical expectations never replace the reusable method rules.
# Notebook-confirmed snapshots additionally use provenance: notebook and:
# verification_source: {kind: notebook, path: <source-path>, ref: <pinned-hash>, output: <table>}

# --- negative expectation alternative (remove sql_shape-only fields) ---
# expected: {kind: negative, reason: lack_data} # lack_data | unresolved_semantics | not_sql
# An appropriate decline/escalation is the expected behavior; never invent a result.
# Optional reviewed variants are {text, observed_at, provenance, approver?}; retain
# only equivalent interpretations, within context.config.yaml's max_per_seed cap.
