# Validate ACF on every PR: schemas pass, links resolve, drafts are surfaced.
name: validate-context
on:
  pull_request:
    # Run for every PR so required checks cannot remain pending on path filters.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install jsonschema pyyaml
      - name: Validate YAML against ACF schemas
        run: python .ci/validate.py --branch-test --require-ready        # validates entities/metrics/domain/seeds
  approval-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema pyyaml
      - name: Check authoring contract
        run: python .ci/approval_policy.py
