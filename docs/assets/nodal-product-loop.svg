<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
  <title id="title">From analyst knowledge to trusted answers</title>
  <desc id="desc">Nodal's product flow: build governed context through an active analyst interview, deploy it through a free self-hosted MCP server or Nodal's hosted PLG service, and answer technical and non-technical questions with planning, uncertainty, verification, and challenge workflows. Enterprise observability, dbt sync, and continuous evaluations feed improvements back into the context.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FF"/>
      <stop offset="1" stop-color="#FFF9F3"/>
    </linearGradient>
    <linearGradient id="enterprise" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#27355D"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3B5CCC"/>
    </marker>
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#DDE5FF"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 36px; font-weight: 760; fill: #172033; letter-spacing: -0.7px; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #526079; }
      .step { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; }
      .card-title { font-size: 25px; font-weight: 760; fill: #172033; }
      .body { font-size: 17px; font-weight: 500; fill: #3E4B65; }
      .small { font-size: 14px; font-weight: 600; fill: #526079; }
      .pill { font-size: 12px; font-weight: 800; letter-spacing: 0.8px; }
      .mini-title { font-size: 15px; font-weight: 760; fill: #172033; }
      .enterprise-title { font-size: 22px; font-weight: 760; fill: #FFFFFF; }
      .enterprise-mini { font-size: 15px; font-weight: 760; fill: #FFFFFF; }
      .enterprise-body { font-size: 14px; font-weight: 550; fill: #DDE5FF; }
    </style>
  </defs>

  <rect width="1440" height="680" rx="28" fill="url(#page)"/>
  <circle cx="1350" cy="55" r="110" fill="#F0EAFE" opacity="0.68"/>
  <circle cx="66" cy="610" r="125" fill="#E7F7EF" opacity="0.72"/>

  <text x="54" y="55" class="sans title">From analyst knowledge to trusted answers</text>
  <text x="54" y="84" class="sans subtitle">Build once · deploy anywhere · improve continuously</text>
  <g transform="translate(1194 38)">
    <rect width="192" height="40" rx="20" fill="#E8EEFF" stroke="#B9C7F5"/>
    <circle cx="24" cy="20" r="7" fill="#3B5CCC"/>
    <text x="41" y="25" class="sans pill" fill="#29449C">OPEN + PORTABLE</text>
  </g>

  <!-- Step 1: active interview -->
  <g filter="url(#shadow)">
    <rect x="54" y="116" width="408" height="334" rx="24" fill="#FFFFFF" stroke="#C8D3FA" stroke-width="2"/>
  </g>
  <rect x="54" y="116" width="408" height="8" rx="4" fill="#3B5CCC"/>
  <g transform="translate(80 145)">
    <circle cx="30" cy="30" r="30" fill="#E8EEFF"/>
    <circle cx="22" cy="24" r="8" fill="none" stroke="#3B5CCC" stroke-width="2.5"/>
    <path d="M9 47c2-10 8-15 13-15s11 5 13 15" fill="none" stroke="#3B5CCC" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M39 18h15a7 7 0 0 1 7 7v8a7 7 0 0 1-7 7h-6l-7 6v-6h-2a7 7 0 0 1-7-7v-8a7 7 0 0 1 7-7z" fill="#FFFFFF" stroke="#3B5CCC" stroke-width="2.3" stroke-linejoin="round"/>
    <circle cx="43" cy="29" r="1.7" fill="#3B5CCC"/>
    <circle cx="49" cy="29" r="1.7" fill="#3B5CCC"/>
    <circle cx="55" cy="29" r="1.7" fill="#3B5CCC"/>
  </g>
  <text x="158" y="158" class="sans step" fill="#3B5CCC">1 · BUILD</text>
  <text x="158" y="191" class="sans card-title">Interview the analyst</text>
  <text x="80" y="236" class="sans body">
    <tspan x="80">An active conversation captures the</tspan>
    <tspan x="80" dy="25">definitions, caveats, joins, and queries</tspan>
    <tspan x="80" dy="25">that make answers correct.</tspan>
  </text>
  <g transform="translate(80 323)">
    <rect width="356" height="82" rx="15" fill="#F3F6FF" stroke="#D6DFFA"/>
    <path d="M19 18h28a5 5 0 0 1 5 5v34a5 5 0 0 1-5 5H19a5 5 0 0 1-5-5V23a5 5 0 0 1 5-5z" fill="#FFFFFF" stroke="#3B5CCC" stroke-width="2"/>
    <path d="M23 31h20M23 39h20M23 47h14" stroke="#3B5CCC" stroke-width="2" stroke-linecap="round"/>
    <text x="67" y="31" class="sans mini-title">Reviewable context + eval seeds</text>
    <text x="67" y="54" class="sans small">The analyst confirms every definition.</text>
  </g>
  <g transform="translate(80 418)">
    <rect width="116" height="23" rx="11.5" fill="#E7F7EF"/>
    <text x="58" y="16" text-anchor="middle" class="sans pill" fill="#16734A">FREE + OPEN</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M474 282H493" stroke="#3B5CCC" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: deploy -->
  <g filter="url(#shadow)">
    <rect x="510" y="116" width="408" height="334" rx="24" fill="#FFFFFF" stroke="#D9CDF8" stroke-width="2"/>
  </g>
  <rect x="510" y="116" width="408" height="8" rx="4" fill="#7A52CC"/>
  <g transform="translate(536 145)">
    <circle cx="30" cy="30" r="30" fill="#F0EAFE"/>
    <rect x="13" y="14" width="34" height="12" rx="4" fill="#FFFFFF" stroke="#7A52CC" stroke-width="2.3"/>
    <rect x="13" y="32" width="34" height="12" rx="4" fill="#FFFFFF" stroke="#7A52CC" stroke-width="2.3"/>
    <circle cx="20" cy="20" r="2" fill="#7A52CC"/>
    <circle cx="20" cy="38" r="2" fill="#7A52CC"/>
    <path d="M47 38h8v10" fill="none" stroke="#7A52CC" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M51 45l4 4 4-4" fill="none" stroke="#7A52CC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="614" y="158" class="sans step" fill="#7A52CC">2 · DEPLOY</text>
  <text x="614" y="191" class="sans card-title">Serve context anywhere</text>

  <g transform="translate(536 221)">
    <rect width="356" height="85" rx="15" fill="#F7F4FE" stroke="#D9CDF8"/>
    <rect x="15" y="14" width="86" height="21" rx="10.5" fill="#E7F7EF"/>
    <text x="58" y="29" text-anchor="middle" class="sans pill" fill="#16734A">FREE</text>
    <text x="116" y="30" class="sans mini-title">Your MCP server</text>
    <text x="15" y="60" class="sans small">Self-host the open files with no lock-in.</text>
  </g>

  <g transform="translate(536 319)">
    <rect width="356" height="102" rx="15" fill="#FFF2E8" stroke="#F2C59E"/>
    <rect x="15" y="14" width="111" height="21" rx="10.5" fill="#FFE1C7"/>
    <text x="70" y="29" text-anchor="middle" class="sans pill" fill="#A34C0A">HOSTED PLG</text>
    <text x="141" y="30" class="sans mini-title">Nodal MCP</text>
    <text x="15" y="58" class="sans small">Fast multi-user access; no database</text>
    <text x="15" y="79" class="sans small">connection required.</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M930 282H949" stroke="#3B5CCC" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: governed answers -->
  <g filter="url(#shadow)">
    <rect x="966" y="116" width="420" height="334" rx="24" fill="#FFFFFF" stroke="#F3CDA9" stroke-width="2"/>
  </g>
  <rect x="966" y="116" width="420" height="8" rx="4" fill="#E87928"/>
  <g transform="translate(992 145)">
    <circle cx="30" cy="30" r="30" fill="#FFF2E8"/>
    <path d="M16 19h28a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8H33l-9 8v-8h-8a8 8 0 0 1-8-8V27a8 8 0 0 1 8-8z" fill="#FFFFFF" stroke="#E87928" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M21 32h18" stroke="#E87928" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="1070" y="158" class="sans step" fill="#D66316">3 · ASK</text>
  <text x="1070" y="191" class="sans card-title">Answer with confidence</text>
  <text x="992" y="226" class="sans body">Technical + non-technical questions</text>

  <g transform="translate(992 251)">
    <rect width="368" height="58" rx="15" fill="#FFF8F1" stroke="#F3D9C2"/>
    <g class="sans mini-title" text-anchor="middle">
      <text x="48" y="35">Plan</text>
      <text x="145" y="35">Query</text>
      <text x="252" y="35">Verify</text>
      <text x="337" y="35">Answer</text>
    </g>
    <path d="M80 29h26M180 29h31M288 29h17" stroke="#E87928" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  </g>
  <g transform="translate(992 322)">
    <rect width="176" height="76" rx="14" fill="#FFF3C9" stroke="#E8CC68"/>
    <circle cx="26" cy="26" r="12" fill="#F2C94C"/>
    <text x="26" y="31" text-anchor="middle" class="sans mini-title">?</text>
    <text x="46" y="29" class="sans mini-title">Uncertainty</text>
    <text x="15" y="56" class="sans small">Know when to pause.</text>
  </g>
  <g transform="translate(1184 322)">
    <rect width="176" height="76" rx="14" fill="#EAF8F1" stroke="#A9DDC4"/>
    <path d="M16 29a12 12 0 1 1 5 9" fill="none" stroke="#16825A" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M16 22v8h8" fill="none" stroke="#16825A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="29" class="sans mini-title">Challenge</text>
    <text x="15" y="56" class="sans small">Test, uphold, or replan.</text>
  </g>
  <g transform="translate(992 418)">
    <rect width="116" height="23" rx="11.5" fill="#E7F7EF"/>
    <text x="58" y="16" text-anchor="middle" class="sans pill" fill="#16734A">FREE + OPEN</text>
  </g>

  <!-- Enterprise learning loop -->
  <g filter="url(#shadow)">
    <rect x="54" y="486" width="1332" height="150" rx="24" fill="url(#enterprise)"/>
  </g>
  <g transform="translate(78 508)">
    <rect width="116" height="24" rx="12" fill="#F2C94C"/>
    <text x="58" y="17" text-anchor="middle" class="sans pill" fill="#172033">ENTERPRISE</text>
  </g>
  <text x="78" y="563" class="sans enterprise-title">The learning loop</text>
  <text x="78" y="589" class="sans enterprise-body">Keep context current, covered, and measured at scale.</text>

  <g transform="translate(386 510)">
    <rect width="250" height="92" rx="16" fill="#25314E" stroke="#52668F"/>
    <circle cx="31" cy="31" r="17" fill="#5269B7"/>
    <path d="M20 31c7-9 15-9 22 0-7 9-15 9-22 0z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="31" cy="31" r="3.5" fill="#FFFFFF"/>
    <text x="59" y="30" class="sans enterprise-mini">Observe usage</text>
    <text x="20" y="66" class="sans enterprise-body">See questions and context gaps.</text>
  </g>
  <path d="M648 556h26" stroke="#DDE5FF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowWhite)"/>

  <g transform="translate(690 510)">
    <rect width="250" height="92" rx="16" fill="#25314E" stroke="#52668F"/>
    <circle cx="31" cy="31" r="17" fill="#8A68D6"/>
    <path d="M22 25h16l-3-4M40 37H24l3 4" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="30" class="sans enterprise-mini">Sync with dbt</text>
    <text x="20" y="66" class="sans enterprise-body">Draft updates when models change.</text>
  </g>
  <path d="M952 556h26" stroke="#DDE5FF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowWhite)"/>

  <g transform="translate(994 510)">
    <rect width="364" height="92" rx="16" fill="#25314E" stroke="#52668F"/>
    <circle cx="31" cy="31" r="17" fill="#E87928"/>
    <path d="M22 32l6 6 12-14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="30" class="sans enterprise-mini">Evaluate continuously</text>
    <text x="20" y="60" class="sans enterprise-body">Coverage + regression tests feed</text>
    <text x="20" y="79" class="sans enterprise-body">analyst-reviewed improvements back.</text>
  </g>

  <path d="M1318 616v20H242v-20" fill="none" stroke="#91A6E6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 7"/>
  <path d="M242 616v-6" stroke="#91A6E6" stroke-width="2.5" marker-end="url(#arrowWhite)"/>
</svg>
